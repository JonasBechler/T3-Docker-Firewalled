services:
  # Owns the network. Sets the outbound rules, then just idles.
  # The agents never run in this container, so they cannot change the rules.
  firewall:
    build:
      context: .
      target: firewall
    image: t3code-firewall:local
    restart: unless-stopped
    init: true
    user: "0:0"
    read_only: true
    tmpfs:
      - /run
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1   # rules are IPv4; no IPv6 bypass
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets firewall.sh find the host for Ollama
    ports:
      - "127.0.0.1:${T3_PORT:-3773}:3773"   # T3 Code, this machine only
      - "${SSH_BIND:-127.0.0.1}:${SSH_PORT:-2222}:2222"   # SSH (see .env.example)
    healthcheck:
      test: ["CMD", "test", "-f", "/run/firewall-ready"]
      interval: 5s
      timeout: 2s
      retries: 5

  t3code:
    build:
      context: .
      target: t3code
      args:
        T3_VERSION: ${T3_VERSION:-latest}
        CODEX_VERSION: ${CODEX_VERSION:-latest}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        CLI_CACHE_BUST: ${CLI_CACHE_BUST:-0}
    image: t3code:local
    restart: unless-stopped
    init: true
    # Command comes from the Dockerfile (entrypoint.sh starts sshd, then T3 Code).

    # Shares the firewall container's network; starts only once rules are in place.
    network_mode: "service:firewall"
    depends_on:
      firewall:
        condition: service_healthy
        restart: true

    # Enough for "sudo apt-get install"; no network capabilities at all.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - SETUID
      - SETGID
      - KILL
      - AUDIT_WRITE

    environment:
      T3CODE_NO_BROWSER: "1"
      DISABLE_AUTOUPDATER: "1"      # CLIs are installed system-wide; update by rebuilding
      OLLAMA_HOST: "http://host.docker.internal:11434"   # Ollama running on the host
      SSH_PASSWORD: ${SSH_PASSWORD:-}   # optional SSH password login; empty = keys only
      # Optional: API keys instead of interactive provider logins
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # OPENAI_API_KEY: ${OPENAI_API_KEY}

    # Bind mounts next to this file. Both are git-ignored; home/ holds logins.
    volumes:
      - ./home:/home/node          # T3 Code state + provider logins
      - ./workspace:/workspace     # your projects
    working_dir: /workspace
